<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D-CSM Time Tracker</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: a working ledger. Logo header, tab row, one view at a time; summary first, tables below. Palette is the D-CSM logo's charcoal and taupe only. */
:root{
  --bg:#F5F3EE; --surface:#ECE8E0; --card:#FBFAF7; --ink:#2B3038; --ink-soft:#5A6070; --rule:#D3CEC3; --accent:#9A9082; --accent-deep:#7E7465;
  --display:"Jost","Century Gothic","Segoe UI",system-ui,sans-serif; --body:"Jost","Century Gothic","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1F232C;--surface:#262B35;--card:#232831;--ink:#EEEAE2;--ink-soft:#B4AEA3;--rule:#3A404C;--accent:#B9AE9B;--accent-deep:#D2C8B6;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1F232C;--surface:#262B35;--card:#232831;--ink:#EEEAE2;--ink-soft:#B4AEA3;--rule:#3A404C;--accent:#B9AE9B;--accent-deep:#D2C8B6;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 64px}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:16px 28px;padding:18px 0 14px;border-bottom:1px solid var(--rule)}
.logo{height:58px;width:auto;color:var(--ink);display:block}
.logo .acc{fill:var(--accent)}
.apptitle{font-family:var(--display);font-weight:300;font-size:22px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
nav{display:flex;flex-wrap:wrap;gap:4px;margin-left:auto}
nav a{font-size:15px;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;color:var(--ink-soft);padding:8px 12px;border-bottom:2px solid transparent}
nav a:hover{color:var(--ink)}
nav a.on{color:var(--ink);border-bottom-color:var(--accent)}
h1{font-family:var(--display);font-weight:400;font-size:26px;letter-spacing:.02em;margin:28px 0 14px;text-wrap:balance}
h2{font-family:var(--display);font-weight:500;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:6px;padding:18px 20px;margin:0 0 20px}
.row{display:flex;flex-wrap:wrap;gap:12px 14px;align-items:flex-end}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.grow{flex:1 1 220px}
label,.lbl{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--rule);border-radius:4px;padding:8px 10px;min-height:40px;max-width:100%}
textarea{min-height:76px;resize:vertical;width:100%}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent-deep);outline-offset:2px}
input[type=checkbox]{min-height:0;width:18px;height:18px;accent-color:var(--accent-deep)}
.w-s{width:96px}.w-m{width:150px}.w-l{width:260px}
button{font:inherit;font-size:14.5px;letter-spacing:.05em;cursor:pointer;border-radius:4px;min-height:40px;padding:8px 16px;border:1px solid var(--ink);background:var(--ink);color:var(--bg)}
button:hover{opacity:.88}
button.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
button.ghost:hover{border-color:var(--ink);opacity:1}
button.sm{min-height:30px;padding:3px 10px;font-size:13px}
button:disabled{opacity:.4;cursor:default}
.hint{font-size:14px;color:var(--ink-soft)}
.banner{margin:14px 0 0;padding:10px 14px;border:1px solid var(--accent);border-left-width:5px;border-radius:4px;background:var(--surface);font-size:15px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:20px}
.tile{background:var(--card);border:1px solid var(--rule);border-radius:6px;padding:14px 16px}
.tile .n{font-family:var(--display);font-weight:300;font-size:34px;line-height:1.1;margin:4px 0 2px}
.tile .s{font-size:13.5px;color:var(--ink-soft)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th{font-weight:500;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);text-align:left;padding:8px 10px;border-bottom:1px solid var(--ink-soft);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
td.num,th.num{text-align:right;white-space:nowrap}
tr.tot td{font-weight:500;border-top:1px solid var(--ink-soft);border-bottom:none}
.bar{height:8px;border-radius:0 4px 4px 0;background:var(--accent);min-width:2px}
.barcell{min-width:140px;width:26%;vertical-align:middle}
.pill{display:inline-block;font-size:12px;letter-spacing:.07em;text-transform:uppercase;padding:2px 9px;border-radius:99px;border:1px solid var(--accent);color:var(--ink-soft);white-space:nowrap}
.pill.solid{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.pill.fill{background:var(--surface)}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--rule);border-radius:4px;overflow:hidden}
.seg button{border:none;border-radius:0;background:transparent;color:var(--ink-soft);min-height:36px;padding:6px 12px}
.seg button.on{background:var(--ink);color:var(--bg)}
.attn{display:flex;flex-direction:column;gap:8px;margin:18px 0 0}
.attn .it{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 14px;background:var(--surface);border-left:5px solid var(--ink);border-radius:4px}
.attn .it.soft{border-left-color:var(--accent)}
.timer{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;padding:14px 18px;background:var(--ink);color:var(--bg);border-radius:6px;margin-bottom:14px}
.timer .el{font-family:var(--display);font-weight:300;font-size:32px;letter-spacing:.04em}
.timer button{background:var(--bg);color:var(--ink);border-color:var(--bg)}
.timer button.ghost{background:transparent;color:var(--bg);border-color:var(--accent)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--accent);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
.weeks{display:flex;align-items:flex-end;gap:6px;height:150px;border-bottom:1px solid var(--ink-soft);padding-top:22px}
.weeks .w{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;position:relative;min-width:0}
.weeks .w i{display:block;width:100%;max-width:38px;background:var(--accent);border-radius:4px 4px 0 0;min-height:1px}
.weeks .w.cur i{background:var(--ink)}
.weeks .w b{position:absolute;bottom:calc(var(--h) + 3px);font-weight:400;font-size:12.5px;color:var(--ink-soft);opacity:0;white-space:nowrap}
.weeks .w:hover b,.weeks .w.show b{opacity:1}
.wl{display:flex;gap:6px;font-size:11.5px;color:var(--ink-soft);margin-top:4px}
.wl span{flex:1;text-align:center;min-width:0;overflow:hidden}
.grid td,.grid th{text-align:right}.grid td:first-child,.grid th:first-child{text-align:left}
.grid td.z{color:var(--rule)}
.muted{color:var(--ink-soft)}
.right{margin-left:auto}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
#modal{position:fixed;inset:0;background:rgba(20,22,28,.5);display:none;align-items:flex-start;justify-content:center;padding:6vh 16px;overflow:auto;z-index:20}
#modal.on{display:flex}
#modal .box{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:22px;width:100%;max-width:620px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:6px;font-size:15px;display:none;z-index:30;max-width:90vw}
.drop{border:2px dashed var(--accent);border-radius:6px;padding:26px 18px;text-align:center;background:var(--bg)}
.drop.over{border-color:var(--ink);background:var(--surface)}
label.btn{display:inline-block;font-size:14.5px;letter-spacing:.05em;text-transform:none;cursor:pointer;border-radius:4px;padding:9px 16px;border:1px solid var(--ink);background:var(--ink);color:var(--bg)}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;min-height:0;padding:0;border:0}
.drop:focus-within label.btn{outline:2px solid var(--accent-deep);outline-offset:2px}
.thb{background:none;border:none;color:inherit;font:inherit;letter-spacing:inherit;text-transform:inherit;padding:0;min-height:0;cursor:pointer}
.thb:hover{color:var(--ink);opacity:1}
.empty{padding:26px 10px;text-align:center;color:var(--ink-soft)}
.work{font-size:13.5px;color:var(--ink-soft)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.stack{display:flex;flex-direction:column;gap:12px}
@media (max-width:640px){.logo{height:46px}nav{margin-left:0}.apptitle{display:none}}
</style>
</head>

async function handleFiles(files){var v=ui.em,added=0,dup=0,bad=[];files=Array.prototype.slice.call(files||[]);v.err=null;
  if(!files.length){v.err='Those emails did not arrive as files. Drag them from Outlook to a folder or the desktop first, then drop the saved files here, or use Choose files.';render();return}
  v.rows=v.rows||[];
  for(var i=0;i<files.length;i++){var f=files[i];try{var buf=new Uint8Array(await f.arrayBuffer()),m;
      if(buf.length>8&&buf[0]===0xD0&&buf[1]===0xCF)m=M.parseMsg(buf);else m=M.parseEml(new TextDecoder('utf-8').decode(buf.subarray(0,200000)));
      var em={id:'m'+L.hash(m.messageId||((m.sender||m.senderName)+'|'+m.subject+'|'+m.receivedDateTime)),subject:m.subject,sender:m.sender,senderName:m.senderName,to:m.to||[],receivedDateTime:m.receivedDateTime||new Date(f.lastModified||Date.now()).toISOString(),summary:m.summary,body:m.body||''};
      if(v.rows.some(function(x){return x.id===em.id})){dup++;continue}
      v.rows.push(em);var sg=L.suggestProject(matchView(em),S.projects,S.sendermap);v.proj[em.id]=sg.id;v.why[em.id]=sg.why;v.min[em.id]='';added++}catch(e){bad.push(f.name)}}
  if(bad.length)v.err=bad.length+' file'+(bad.length===1?'':'s')+' could not be read as an email: '+bad.slice(0,5).join(', ')+(bad.length>5?' and others':'')+'. Only .msg and .eml files work.';
  toast(added+' email'+(added===1?'':'s')+' added'+(dup?', '+dup+' already in the list':'')+'.');render()}
async function markEmails(ems,kind){var by={};ems.forEach(function(em){(by[emMonth(em)]=by[emMonth(em)]||[]).push(em)});
  for(var m in by){var cur=JSON.parse(JSON.stringify(S.emaillog[m]||{}));cur.l=cur.l||{};cur.d=cur.d||{};by[m].forEach(function(em){cur[kind][emKey(em)]=1});await Store.set('emaillog',m,cur)}}
async function logEmails(){var v=ui.em,c=cfg(),ems=emVisible().filter(function(em){return v.sel[em.id]});if(!ems.length)return;
  if(ems.some(function(em){return !v.proj[em.id]})){toast('Choose a project for every ticked email.');return}

  try{for(var i=0;i<ems.length;i++){var em=ems[i],p=proj(v.proj[em.id]),raw=Math.round(+v.min[em.id]||0),sent=isSent(em),who=partyText(em);
      await Store.set('entries',uid(),{projectId:v.proj[em.id],date:emDate(em),start:em.receivedDateTime?L.timeLondon(new Date(em.receivedDateTime)):'',desc:(sent?'Email to ':'Email from ')+(who||'unknown')+': '+String(em.subject||'(no subject)'),rawMinutes:raw,minutes:raw>0?L.roundMinutes(raw,c.rounding):0,ratePence:(p&&p.ratePence)||0,source:'email',invoiceId:null,
        emails:[{s:String(em.subject||'').slice(0,140),f:who.slice(0,120),t:em.receivedDateTime||'',dir:sent?'to':'from'}],createdAt:new Date().toISOString()})}
    await markEmails(ems,'l');var map=JSON.parse(JSON.stringify(S.sendermap)),ch=false;ems.forEach(function(em){matchView(em).parties.forEach(function(s){var h=L.hash(s),cur=map[h];if(typeof cur==='string'){var o={};o[cur]=1;cur=o}cur=cur||{};cur[v.proj[em.id]]=(cur[v.proj[em.id]]||0)+1;map[h]=cur;ch=true})});if(ch)await Store.set('meta','sendermap',{map:map});

  csv:async function(){var r=periodRange(),ents=S.entries.filter(function(e){return inRange(e,r)}).sort(function(a,b){return a.date<b.date?-1:1});if(!ents.length){toast('Nothing to export in this period.');return}
    var rows=[['Date','Project','Client','Description','Hours','Rate GBP','Amount GBP','Invoice','Source']].concat(ents.map(function(e){var p=proj(e.projectId)||{},inv=S.invoices.find(function(i){return i.id===e.invoiceId});return [L.fmtUK(e.date),p.name||'',p.client||'',e.desc||'',L.fmtHours(e.minutes),((e.ratePence||0)/100).toFixed(2),(Math.round(e.minutes*(e.ratePence||0)/60)/100).toFixed(2),inv?inv.number:'',e.source||'']}));
    await saveFile('D-CSM time '+(r[0]?r[0]+' to '+r[1]:'all')+'.csv',L.csv(rows))},
  ics:async function(){var ps=S.projects.filter(function(p){return p.active!==false&&p.invoiceDay});if(!ps.length){toast('Set an invoice day on at least one open project first.');return}
    var stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+Z$/,'Z'),ics=L.buildICS(S.projects,today,stamp);
    if(await saveFile('D-CSM invoice reminders.ics',ics))toast('Open the downloaded file to add the reminders to Outlook.')},
  invStart:function(el){var aps=activeProjects(),pid=(el&&el.dataset.id)||(aps[0]||{}).id;if(!pid)return;var ub=unbilled(pid).map(function(e){return e.date}).sort();
    ui.inv={projectId:pid,from:ub[0]||L.monthStart(today),to:today,issueDate:today,excl:{}};if(ui.view!=='invoices')location.hash='invoices';else render()},
  invCancel:function(){ui.inv=null;render()},
  invToggle:function(el){if(el.checked)delete ui.inv.excl[el.dataset.id];else ui.inv.excl[el.dataset.id]=1;render()},
  invCreate:async function(el){var v=ui.inv,c=cfg(),p=proj(v.projectId),sel=invCandidates().filter(function(e){return !v.excl[e.id]});if(!p||!sel.length)return;el.disabled=true;
    var sub=L.weekSum(sel,v.from,v.to),vat=c.vatOn?Math.round(sub*c.vatRate/100):0,id=uid(),number=c.prefix+String(c.nextNumber).padStart(4,'0');
    var inv={number:number,projectId:p.id,projectName:p.name,ref:p.ref||'',client:p.client||'',clientAddress:p.clientAddress||'',issueDate:v.issueDate,dueDate:L.addDays(v.issueDate,+c.termsDays||0),from:v.from,to:v.to,
      lines:sel.map(function(e){return {date:e.date,desc:e.desc||'',minutes:e.minutes,ratePence:e.ratePence||0}}),minutes:L.minutes(sel),subtotalPence:sub,vatRate:c.vatOn?+c.vatRate:0,vatPence:vat,totalPence:sub+vat,status:'unpaid',paidDate:'',biz:c,createdAt:new Date().toISOString()};
    try{await Store.set('invoices',id,inv);await Store.set('meta','settings',Object.assign({},S.settings,{nextNumber:(+c.nextNumber||1)+1}));
      for(var i=0;i<sel.length;i+=5)await Promise.all(sel.slice(i,i+5).map(function(e){return Store.set('entries',e.id,Object.assign({},e,{invoiceId:id}))}));
      ui.inv=null;toast('Invoice '+number+' created. Use PDF to download it.');render()}catch(e){el.disabled=false}},
  invPdf:async function(el){var inv=S.invoices.find(function(i){return i.id===el.dataset.id});if(!inv)return;var logo=await getLogoPng(),buf=null;try{buf=buildPdf(inv,logo)}catch(e){buf=null}
    if(!buf){toast('The PDF could not be built. Reload the page and try again.');return}await saveFile(inv.number+' '+String(inv.projectName).replace(/[^\w \-]/g,'').slice(0,60)+'.pdf',buf)},
  invPaid:async function(el){var inv=S.invoices.find(function(i){return i.id===el.dataset.id});if(!inv)return;var paid=inv.status!=='paid';try{await Store.set('invoices',inv.id,Object.assign({},inv,{status:paid?'paid':'unpaid',paidDate:paid?today:''}))}catch(e){}},
  invVoid:function(el){var inv=S.invoices.find(function(i){return i.id===el.dataset.id});if(!inv)return;confirmBox('Void invoice '+inv.number,'This deletes the invoice and returns its '+L.fmtHours(inv.minutes)+' hours to unbilled. The number '+inv.number+' is not reused.','Void invoice',async function(){
    try{var es=S.entries.filter(function(e){return e.invoiceId===inv.id});for(var i=0;i<es.length;i+=5)await Promise.all(es.slice(i,i+5).map(function(e){return Store.set('entries',e.id,Object.assign({},e,{invoiceId:null}))}));await Store.del('invoices',inv.id);toast('Invoice voided.')}catch(e){}})},
  emClear:function(){var v=ui.em,n=(v.rows||[]).length;confirmBox('Clear the list','Are you sure? This removes all '+n+' email'+(n===1?'':'s')+' from the list, including any project and minutes you have set but not yet logged. Emails already logged stay in the Timesheet.','Clear list',function(){v.rows=null;v.sel={};v.proj={};v.min={};v.why={};v.manual={};v.err=null;render()})},
  emSel:function(el){ui.em.sel[el.dataset.id]=el.checked;updateEmTable()},
  emAll:function(el){var v=ui.em;emVisible().forEach(function(em){v.sel[em.id]=el.checked});updateEmTable()},
  emShow:function(el){ui.em.showDone=!!el.checked;updateEmTable()},
  emSort:function(el){var s=ui.em.sort,k=el.dataset.k;if(s.k===k)s.dir=-s.dir;else{s.k=k;s.dir=1}updateEmTable()},
  emFilterClear:function(){ui.em.f={who:'',subj:'',proj:'',from:'',to:''};render()},
  emLog:function(){logEmails()},
  emMine:async function(){var v=ui.em,first=v.rows&&v.rows[0];if(!first)return;var add=first.sender||first.senderName,list=myAddrs();if(list.indexOf(String(add).toLowerCase())<0)list.push(add);
    try{await Store.set('meta','settings',Object.assign({},S.settings,{myEmails:list.join(', ')}));resuggest();toast('Added. The list now shows who each email went to.');render()}catch(e){}},
  emCopy:async function(el){var em=ui.em.rows.find(function(x){return x.id===el.dataset.id});if(!em)return;var q=L.outlookSearch(em,isSent(em)?((parties(em)[0]||{}).name||(parties(em)[0]||{}).email||''):'');try{await navigator.clipboard.writeText(q);toast('Outlook search string copied.')}catch(e){toast(q)}},
  setupSave:async function(){var c=cfg(),g=function(k){return dv('s_'+k,c[k])},n=Object.assign({},S.settings);
    ['name','address','companyNo','vatNo','contact','email','phone','website','prefix','bank','notes','presets'].forEach(function(k){n[k]=String(g(k)).trim()});
    n.nextNumber=Math.max(1,parseInt(g('nextNumber'),10)||1);n.termsDays=Math.max(0,parseInt(g('termsDays'),10)||0);n.vatOn=!!g('vatOn');n.vatRate=Math.max(0,parseFloat(g('vatRate'))||0);n.rounding=+g('rounding')||15;n.myEmails=String(dv('s_myEmails',c.myEmails||c.email)).trim();var dr=L.parseMoney(dv('s_defaultRate',(c.defaultRatePence/100).toFixed(2)));n.defaultRatePence=dr==null?c.defaultRatePence:dr;
    try{await Store.set('meta','settings',n);Object.keys(ui.draft).forEach(function(k){if(k.indexOf('s_')===0)delete ui.draft[k]});toast('Setup saved.');render()}catch(e){}}
};
document.addEventListener('click',function(ev){var el=ev.target.closest('[data-act]');if(!el)return;if(el.tagName==='INPUT'&&el.type!=='checkbox')return;var f=A[el.dataset.act];if(f)f(el)});
$('modal').addEventListener('mousedown',function(ev){if(ev.target===$('modal'))closeModal()});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&$('modal').classList.contains('on'))closeModal();if(ev.key==='Enter'&&ev.target.dataset&&ev.target.dataset.enter){ui.draft[ev.target.dataset.d]=ev.target.value;var f=A[ev.target.dataset.enter];if(f)f(ev.target)}});
async function restoreBackup(file){var j;try{j=JSON.parse(await file.text())}catch(e){toast('That file could not be read as a backup.');return}
  if(!j||j.app!=='dcsm-time-tracker'||!Array.isArray(j.docs)){toast('That file is not a D-CSM tracker backup.');return}
  var docs=j.docs.filter(function(d){return d&&typeof d.col==='string'&&typeof d.id==='string'&&d.data&&typeof d.data==='object'});
  confirmBox('Restore from backup','This adds '+docs.length+' records from the backup dated '+L.fmtUK(String(j.exportedAt||'').slice(0,10))+'. Records with the same reference are overwritten by the backup copy. Nothing else is deleted.','Restore',async function(){
    try{var now=new Date().toISOString();for(var i=0;i<docs.length;i+=200){var r=await sb.from('docs').upsert(docs.slice(i,i+200).map(function(d){return {user_id:session.user.id,col:d.col,id:d.id,data:d.data,updated_at:now}}),{onConflict:'user_id,col,id'});if(r.error)throw r.error}
      await loadAll();toast(docs.length+' records restored.')}catch(e){fail(e)}})}
function onField(ev,isChange){var el=ev.target,d=el.dataset;if(!d)return;
  if(el.id==='bkFile'){if(isChange){var bf=el.files&&el.files[0];el.value='';if(bf)restoreBackup(bf)}return}
  if(el.id==='emFile'){if(isChange){var fl=Array.prototype.slice.call(el.files||[]);el.value='';if(fl.length)handleFiles(fl)}return}
  if(d.d){ui.draft[d.d]=el.type==='checkbox'?el.checked:el.value;if(d.d.indexOf('l_')===0){var pv=$('l_prev');if(pv)pv.textContent=logPreviewText();return}if(isChange&&d.rr){pendingRender=false;render()}return}
  if(d.inv&&isChange){if(el.value)ui.inv[d.inv]=el.value;if(d.inv==='projectId'){var ub=unbilled(el.value).map(function(e){return e.date}).sort();ui.inv.from=ub[0]||L.monthStart(today);ui.inv.excl={};render()}else if(!coarse)pendingRender=true;return}
  if(d.emp){ui.em.proj[d.emp]=el.value;ui.em.manual[d.emp]=1;ui.em.why[d.emp]='';return}
  if(el.id==='emBulk'){if(isChange&&el.value){var bv=ui.em;emVisible().forEach(function(em){if(bv.sel[em.id]){bv.proj[em.id]=el.value;bv.manual[em.id]=1;bv.why[em.id]=''}});updateEmTable()}return}
  if(el.id&&el.id.indexOf('ef_')===0){ui.em.f[el.id.slice(3)]=el.value;updateEmTable();return}
  if(d.emm){ui.em.min[d.emm]=el.value;return}}
document.addEventListener('input',function(ev){onField(ev,false)});
document.addEventListener('change',function(ev){onField(ev,true)});
document.addEventListener('focusout',function(ev){setTimeout(function(){if(!coarse&&ev.target&&ev.target.dataset&&ev.target.dataset.rrb)pendingRender=true;flush()},0)});
document.addEventListener('dragover',function(ev){if(ui.view!=='emails')return;ev.preventDefault();var d=$('drop');if(d)d.classList.add('over')});
document.addEventListener('dragleave',function(ev){if(!ev.relatedTarget){var d=$('drop');if(d)d.classList.remove('over')}});
document.addEventListener('drop',function(ev){if(ui.view!=='emails')return;ev.preventDefault();var d=$('drop');if(d)d.classList.remove('over');handleFiles(ev.dataTransfer&&ev.dataTransfer.files)});
setInterval(function(){var t=L.todayISO();if(t!==today){today=t;refresh()}},60000);
var h0=(location.hash||'').replace('#','');if(VIEWS.some(function(v){return v[0]===h0}))ui.view=h0;
boot();
})();
</script>
